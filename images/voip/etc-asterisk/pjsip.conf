; SIP channel driver (chan_pjsip).  Nothing is declared here: without a transport section
; Asterisk does not listen on any SIP port.
;
;   [transport-udp]          a listening socket
;   type = transport
;   protocol = udp
;   bind = 0.0.0.0:5060
;
;   [1001]                   an account = an endpoint + its auth + its aor (address of record)
;   type = endpoint
;   ...
;
; After a change: asterisk -rx "pjsip reload"   (a changed transport needs a restart).
