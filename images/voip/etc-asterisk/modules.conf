; Only the modules named here are loaded (the ones they require come with them): a SIP PBX on
; chan_pjsip with the usual dialplan applications, voicemail, G.711 / G.722 / GSM, SRTP.
; The image holds every module of a default Asterisk build in /usr/lib/asterisk/modules: add a
; "load =" line here, or load one by hand with: asterisk -rx "module load app_queue.so".

[modules]
autoload = no

; -- dialplan
load = pbx_config.so
load = pbx_spool.so

; -- channel drivers and bridges
load = chan_pjsip.so
load = chan_bridge_media.so
load = bridge_simple.so
load = bridge_native_rtp.so
load = bridge_softmix.so
load = bridge_holding.so
load = bridge_builtin_features.so
load = bridge_builtin_interval_features.so

; -- media: RTP, SRTP, codecs, file formats
load = res_rtp_asterisk.so
load = res_srtp.so
load = res_crypto.so
load = res_timing_timerfd.so
load = codec_alaw.so
load = codec_ulaw.so
load = codec_a_mu.so
load = codec_gsm.so
load = codec_g722.so
load = codec_resample.so
load = format_pcm.so
load = format_wav.so
load = format_wav_gsm.so
load = format_gsm.so
load = format_sln.so

; -- applications
load = app_dial.so
load = app_playback.so
load = app_echo.so
load = app_voicemail.so
load = app_verbose.so
load = app_stack.so
load = app_exec.so
load = app_read.so
load = app_senddtmf.so
load = app_sayunixtime.so
load = app_milliwatt.so
load = app_playtones.so
load = app_record.so
load = app_originate.so
load = app_system.so
load = app_softhangup.so
load = app_transfer.so
load = app_while.so
load = app_dumpchan.so
load = app_bridgewait.so
load = app_directory.so

; -- functions
