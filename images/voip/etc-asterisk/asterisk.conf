; Minimal Asterisk configuration of the sysreseval/voip image.
; The directories are the compiled-in ones (/etc/asterisk, /usr/lib/asterisk/modules,
; /var/lib/asterisk, /var/spool/asterisk, /var/log/asterisk, /var/run/asterisk).

[options]
; Level of the messages of a remote console (asterisk -r); raise it there with -vvv or
; "core set verbose 5".
verbose = 3
