global_defs {
    router_id lb1
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    fall 2
    rise 2
}

vrrp_instance SHOP {
    state MASTER
    interface eth0
    virtual_router_id 202
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass mnAfu6Yl
    }
    virtual_ipaddress {
        192.168.227.57/24
    }
    track_script {
        chk_haproxy
    }
}
