port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
ca ca.crt
cert srv.crt
key srv.key
dh none
tls-crypt ta.key
crl-verify crl.pem
keepalive 10 120
persist-key
persist-tun
user nobody
group nogroup
verb 3
explicit-exit-notify 1
push "route 192.168.100.0 255.255.255.0"
client-config-dir ccd
route 192.168.200.0 255.255.255.0
