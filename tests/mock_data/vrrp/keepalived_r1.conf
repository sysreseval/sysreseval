global_defs {
    router_id r1
    enable_script_security
    script_user root
}

vrrp_script chk_upstream {
    script "/etc/keepalived/check_upstream.sh"
    interval 2
    fall 2
    rise 2
}

vrrp_sync_group G_EDGE {
    group {
        VI_LAN
        VI_WAN
        VI_LAN6
    }
    track_script {
        chk_upstream
    }
    notify /etc/keepalived/notify.sh
}

vrrp_instance VI_LAN {
    interface eth0
    virtual_router_id 140
    state MASTER
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass JEi8ETl3
    }
    virtual_ipaddress {
        192.168.56.254/24
    }
}

vrrp_instance VI_WAN {
    interface eth1
    virtual_router_id 100
    state MASTER
    priority 150
    advert_int 1
    unicast_src_ip 198.51.100.251
    unicast_peer {
        198.51.100.252
    }
    virtual_ipaddress {
        198.51.100.254/24
    }
    virtual_ipaddress_excluded {
        fd9e:56e8:50cc:b463::254/64
    }
}

vrrp_instance VI_LAN2 {
    interface eth0
    virtual_router_id 59
    state BACKUP
    priority 100
    advert_int 1
    use_vmac
    track_interface {
        eth1
    }
    virtual_ipaddress {
        192.168.56.253/24
    }
}

vrrp_instance VI_LAN6 {
    interface eth0
    version 3
    virtual_router_id 115
    state MASTER
    priority 150
    advert_int 1
    virtual_ipaddress {
        fe80::1/64
    }
}
