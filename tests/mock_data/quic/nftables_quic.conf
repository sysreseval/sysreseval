#!/usr/sbin/nft -f
flush ruleset

table inet filter {
	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		iifname "eth1" oifname "eth0" tcp dport { 80, 443 } accept
		iifname "eth1" oifname "eth0" udp dport 443 accept
		iifname "eth1" oifname "eth0" meta l4proto { tcp, udp } th dport 53 accept
		iifname "eth1" icmp type echo-request accept
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "eth0" masquerade random
	}
}
