# Podman engine of SRE: a machine running systemd uses kernel keys (one keyring per service),
# counted against the uid of its root, which is an ordinary uid of the host.  The quota of an
# ordinary user (200 keys, 20000 bytes) stops a project at a few systemd machines.
kernel.keys.maxkeys  = 20000
kernel.keys.maxbytes = 2000000
