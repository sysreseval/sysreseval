# /etc/sreweb/agent.toml (checkout) or /etc/sysreseval/agent.toml (Debian package): the agent of
# a pool host of the SRE web site (sre-agent).  Owned by root, mode 0600: it holds the token.
# The systemd unit starts the agent only when this file exists and the marker file
# /etc/sreweb/DO_NOT_START_AGENT does not; a configuration error (exit status 78) is not retried.
#
# Other files merged into this one before it is checked, each path relative to this directory: a
# directory (its *.toml files, by name), a glob (possibly matching nothing) or a file (it must
# exist).  Tables merge; a key given twice is refused, naming both files; an imported file cannot
# import.  Same owner and mode as this file.  E.g. this file the same on every host of a standard
# image, and the lines of the host (its address, token and certificate: the agent-<name>.toml of
# scripts/make-web-hosts.sh) in agent.d/host.toml, listen and token then removed from here:
# import = ["agent.d"]
#   # agent.d/host.toml
#   listen = "10.0.128.1:8451"
#   token = "change-me-to-a-long-random-string"
#   tls_cert = "/etc/sreweb/tls/a01.crt"
#   tls_key = "/etc/sreweb/tls/a01.key"
#   tls_ca = "/etc/sreweb/tls/ca.crt"
#
# The address the portal reaches.  0.0.0.0 is every interface of the host, the Docker bridge the
# containers of the students reach (172.17.0.1) included: set allowed_clients and tls_ca below so
# that only the portal gets past.  Or the address of a management interface, never one the
# students reach.
listen = "0.0.0.0:8451"
# Shared secret of this host, repeated in the [[hosts]] entry of the portal's web.toml (32+ characters).
token = "change-me-to-a-long-random-string"
# The sre command (default: the one of this installation).
# sre_exe = "/opt/sre/sbin/sre"
# Default idle timeout of a project nobody touched (the portal gives its own per user): "24h", "0" = never.
max_idle = "24h"
# Terminals per project and per device (each Connect opens a new terminal on the machine),
# concurrent starts and evaluations on this host.
terminals_per_project = 16
terminals_per_device = 4
max_concurrent_starts = 2
max_concurrent_evals = 2
# Seconds the lab list is cached.
lab_list_cache_ttl = 60
# TLS between the portal and this agent: the certificate of this host, and with tls_ca the CA
# whose client certificate the portal must present (mutual TLS; scripts/web-tls.sh makes the CA
# and the certificates).  The files must be readable by root only.
# tls_cert = "/etc/sreweb/tls/a01.crt"
# tls_key = "/etc/sreweb/tls/a01.key"
# tls_ca = "/etc/sreweb/tls/ca.crt"
# The addresses or networks the agent answers (empty: any); the portal's.
# allowed_clients = ["10.0.0.1"]
# When the workstation is "occupied" (reported to the portal, which then places no project here
# and never powers the host off): a local login session ("sessions": loginctl, or who), projects
# of the Qt GUI ("projects"), "both" or "never".
occupied_check = "both"
# What the agent does with the projects it manages when it stops (the nightly shutdown, a restart
# of the unit): "shutdown" closes them (the last evaluation, then sre stop) only when the system is
# going down, "always" at every stop, "never"; within shutdown_timeout seconds (the unit's
# TimeoutStopSec is 300).
close_projects_on_stop = "shutdown"
shutdown_timeout = 240
# Whether the portal may power this host off (POST /v1/power/off, refused when occupied or with
# any project), and how.
allow_power_off = false
power_off_command = "systemctl poweroff"
# How the agent restarts itself on `sre-web-tool restart` (POST /v1/restart: new code after an
# update; the projects stay, the open terminals and desktops are lost): by default
# `systemctl restart` of its own unit, found in /proc/self/cgroup; a command for an agent
# run otherwise (the request is refused when neither applies).
# restart_command = ""
# Timeouts of the sre commands, in seconds.
[timeouts]
start = 900
eval = 600
state = 600
stop = 300
list = 30
# One virtual X desktop per project whose lab has an x11_host machine (the Wireshark lab): a
# TigerVNC Xvnc and a window manager, shown in the Display tab of the web site.  Needs the
# packages tigervnc-standalone-server and openbox and the unprivileged user the X processes run
# as (sreweb-x11, created by the sysreseval-agent package or scripts/install.sh).  Display :N
# listens on TCP port 6000+N for the containers of the project, protected by its own X cookie;
# the RFB socket of the browser is under runtime_dir, for the agent only.
[display]
enabled = false
user = "sreweb-x11"
