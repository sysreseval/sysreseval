# /etc/sreweb/agent.toml (checkout) or /etc/sysreseval/agent.toml (Debian package): the agent of
# a pool host of the SRE web site (sre-agent).  Owned by root, mode 0600: it holds the token.
# The systemd unit starts the agent only when this file exists and the marker file
# /etc/sreweb/DO_NOT_START_AGENT does not; a configuration error (exit status 78) is not retried.
#
# Other files merged into this one before it is checked, each path relative to this directory: a
# directory (its *.toml files, by name), a glob (possibly matching nothing) or a file (it must
# exist).  Tables merge; a key given twice is refused, naming both files; an imported file cannot
# import.  Same owner and mode as this file.  E.g. this file the same on every host of a standard
# image, and the lines of the host (its address, token and certificate: the agent-<name>.toml of
# scripts/make-web-hosts.sh) in agent.d/host.toml, listen and token then removed from here:
# import = ["agent.d"]
#   # agent.d/host.toml
#   listen = "10.0.128.1:8451"
#   token = "change-me-to-a-long-random-string"
#   tls_cert = "/etc/sreweb/tls/a01.crt"
#   tls_key = "/etc/sreweb/tls/a01.key"
#   tls_ca = "/etc/sreweb/tls/ca.crt"
#
# The address the portal reaches.  0.0.0.0 is every interface of the host, the Docker bridge the
# containers of the students reach (172.17.0.1) included: set allowed_clients and tls_ca below so
# that only the portal gets past.  Or the address of a management interface, never one the
# students reach.
listen = "0.0.0.0:8451"
# Shared secret of this host, repeated in the [[hosts]] entry of the portal's web.toml (32+ characters).
token = "change-me-to-a-long-random-string"
# The sre command (default: the one of this installation).
# sre_exe = "/opt/sre/sbin/sre"
# Default idle timeout of a project nobody touched (the portal gives its own per user): "24h", "0" = never.
max_idle = "24h"
# Terminals per project and per device (each Connect opens a new terminal on the machine),
# concurrent starts and evaluations on this host.
terminals_per_project = 16
terminals_per_device = 4
max_concurrent_starts = 2
max_concurrent_evals = 2
# A terminal whose last browser left (the page closed or reloaded, another project opened, the
# network cut) is kept this long for the browser to come back to it: "120m"; "0" ends it at
# once. A terminal closed by its × ends at once in any case.
terminals_linger = "120m"
# Seconds the lab list is cached.
lab_list_cache_ttl = 60
# TLS between the portal and this agent: the certificate of this host, and with tls_ca the CA
# whose client certificate the portal must present (mutual TLS; scripts/web-tls.sh makes the CA
# and the certificates).  The files must be readable by root only.
# tls_cert = "/etc/sreweb/tls/a01.crt"
# tls_key = "/etc/sreweb/tls/a01.key"
# tls_ca = "/etc/sreweb/tls/ca.crt"
# The addresses or networks the agent answers (empty: any); the portal's.
# allowed_clients = ["10.0.0.1"]
# When the workstation is "occupied" (reported to the portal, which then places no project here
# and never powers the host off): a local login session ("sessions": loginctl, or who), projects
# of the Qt GUI ("projects"), "both" or "never".
occupied_check = "both"
# What the agent does with the projects it manages when it stops (the nightly shutdown, a restart
# of the unit): "shutdown" closes them (the last evaluation, then sre stop) only when the system is
# going down, "always" at every stop, "never"; within shutdown_timeout seconds (the unit's
# TimeoutStopSec is 300).
close_projects_on_stop = "shutdown"
shutdown_timeout = 240
# Whether the portal may power this host off (POST /v1/power/off, refused when occupied or with
# any project), and how.
allow_power_off = false
power_off_command = "systemctl poweroff"
# Whether this host may ask for its own drain: `sre set-drain` run by root on the host (the
# script of a session-end button, in place of a shutdown) makes the portal place no new project
# here and power the host off once it is empty, like Drain on the Pool page (so power = true in
# web.toml and allow_power_off = true above). `sre remove-drain`, or Enable on the Pool page,
# cancels it. This is the default of the host: the Pool page can allow or forbid it until the
# next boot.
allow_local_drain = false
# Whether a drain powers this host off even while the portal has it disabled (`sre-web-tool
# disable`, or enabled = false in web.toml). A disabled host is otherwise never powered off by
# the portal: a drain there never ends, although `sre set-drain` succeeds (the host does not
# know that it is disabled). With true, both drains end with the power off once the host is
# empty: the one asked here (`sre set-drain`) and the portal's (`sre-web-tool drain`, Drain on
# the Pool page, then available on a disabled host). The power off itself still needs
# allow_power_off = true above and power = true in web.toml.
allow_power_off_when_disabled = false
# How the agent restarts itself on `sre-web-tool restart` (POST /v1/restart: new code after an
# update; the projects stay, the open terminals and desktops are lost): by default
# `systemctl restart` of its own unit, found in /proc/self/cgroup; a command for an agent
# run otherwise (the request is refused when neither applies).
# restart_command = ""
# Timeouts of the sre commands, in seconds (report: the spreadsheet / PDF reports an instructor
# downloads from the Archives page, built by `sre report` from the records of the database).
[timeouts]
start = 900
eval = 600
state = 600
stop = 300
save = 900      # a project saved into the directory of [saves]
restore = 900   # ... and restored from it
list = 30
report = 600
# One virtual X desktop per project whose lab has an x11_host machine (the Wireshark lab): a
# TigerVNC Xvnc and a window manager, shown in the Display tab of the web site.  Needs the
# packages tigervnc-standalone-server and openbox and the unprivileged user the X processes run
# as (sreweb-x11, created by the sysreseval-agent package or scripts/install.sh).  Display :N
# listens on TCP port 6000+N for the containers of the project, protected by its own X cookie;
# the RFB socket of the browser is under runtime_dir, for the agent only.
[display]
enabled = false
user = "sreweb-x11"
# xvnc_command = "Xvnc"
# window_manager_command = "openbox"
# geometry = "1280x800"
# depth = 24
# frame_rate = 30
# first_display = 10
# last_display = 99
# runtime_dir = "/run/sre-agent"
# start_timeout = 10
# The Docker images of the labs pulled by this agent (`sre preload-images`) when the portal gives
# the host its turn: the portal lets a few hosts download at the same time ([pool] max_preloads
# of web.toml), instead of every workstation at its boot.  at_start: the agent asks for a preload
# each time it starts (the boot of the host); `sre-web-tool preload` and the Pool page ask by
# hand, whatever at_start says.  With at_start, leave sre-preload-images.service disabled on the
# host: both would pull.  paths: the lab files and directories scanned (default: the lab
# directories of the installation); timeout: a preload still running after this long is stopped.
[preload]
at_start = false
# paths = ["/opt/sre/lab"]
# timeout = "2h"
# What the running projects use, measured by this agent for the portal: their containers, the
# memory and the processor time of each (read in its cgroup, version 2), and the processors the
# whole host uses.  The portal learns from these figures what a project of each lab costs
# ([pool] capacity of web.toml).  Nothing is limited.  The containers are found as the container
# engine of the host has them (container_engine of params.py): one request to the Docker daemon
# on its socket, or, with the Podman engine, the slices of the projects in the cgroup tree.
# interval: the time between two measures, 0 = no measure; docker_socket: the socket of the
# daemon (default: the one of the host, /var/run/docker.sock); podman_slices: the cgroup
# directory of the slices of the projects (default: the one of the account of the engine,
# .../user@<uid>.service/srelab.slice), read in place of the daemon when given; cgroup_root:
# where the cgroups are; meminfo: where the memory of the host is read.
# [usage]
# interval = "15s"
# docker_socket = "/var/run/docker.sock"
# podman_slices = "/sys/fs/cgroup/user.slice/user-1100.slice/user@1100.service/srelab.slice"
# cgroup_root = "/sys/fs/cgroup"
# meminfo = "/proc/meminfo"
# The saved projects of the web site: a user saves a project whose lab allows it
# (allow_save_restore) and restores it later, on this host or on another.  dir: the directory of
# the saved projects, a volume every pool host mounts at the same place (NFS); nothing is saved
# without it.  The agent itself never touches the directory: each access is a small program run
# as `user` (sre), so the export may squash root and the directory stays closed to the local
# users of the host.  Prepare the volume once:
#     mkdir /srv/sre-saves ; chown sre:sre /srv/sre-saves ; chmod 700 /srv/sre-saves
#     runuser -u sre -- touch /srv/sre-saves/.sre-saves
# and leave the mount point itself to root on each host.  The last line makes the marker of the
# volume, and nothing else ever does (the agent could not tell the volume from the empty
# directory under it): without the marker a host saves nothing and its projects have no Save
# Project button; the Pool page and `sre-web-tool list` then show the host as "saves unusable"
# with the reason, which is also in the journal of the agent.  max_size_mb: a project whose save is
# larger is not saved; min_free_mb: no save below this much free space, in the directory and
# where sre save builds its archive (/var/lib/sre/tmp); max_concurrent: saves running at once on
# this host; timeout: the time one access to the directory may take (a volume that hangs).
# On the portal: [saves] enabled = true of web.toml, and the limit of saved projects per user.
# [saves]
# dir = "/srv/sre-saves"
# user = "sre"
# max_size_mb = 512
# min_free_mb = 2048
# max_concurrent = 1
# timeout = "30s"
