# /opt/sre/etc/agent.toml (checkout) or /etc/sysreseval/agent.toml (Debian package): the agent of
# a pool host of the SRE web site (sre-agent).  Owned by root, mode 0600: it holds the token.
#
# The agent listens on a management address the portal reaches; never expose it to the students.
listen = "10.0.0.11:8451"
# Shared secret of this host, repeated in the [[hosts]] entry of the portal's web.toml (32+ characters).
token = "change-me-to-a-long-random-string"
# The sre command (default: the one of this installation).
# sre_exe = "/opt/sre/sbin/sre"
# Default idle timeout of a project nobody touched (the portal gives its own per user): "24h", "0" = never.
max_idle = "24h"
# Terminals per project and per device (each Connect opens a new terminal on the machine),
# concurrent starts and evaluations on this host.
terminals_per_project = 16
terminals_per_device = 4
max_concurrent_starts = 2
max_concurrent_evals = 2
# Seconds the lab list is cached.
lab_list_cache_ttl = 60
# TLS between the portal and this agent: the certificate of this host, and with tls_ca the CA
# whose client certificate the portal must present (mutual TLS; scripts/web-tls.sh makes the CA
# and the certificates).  The files must be readable by root only.
# tls_cert = "/etc/sysreseval/tls/a01.crt"
# tls_key = "/etc/sysreseval/tls/a01.key"
# tls_ca = "/etc/sysreseval/tls/ca.crt"
# The addresses or networks the agent answers (empty: any); the portal's.
# allowed_clients = ["10.0.0.1"]
# Timeouts of the sre commands, in seconds.
[timeouts]
start = 900
eval = 600
state = 600
stop = 300
export = 600
list = 30
