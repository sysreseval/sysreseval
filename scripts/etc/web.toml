# /etc/sreweb/web.toml (checkout) or /etc/sysreseval/web.toml (Debian package): the SRE web site
# (sre-web).  Owned by root, group sre-web, mode 0640: it holds the secret and the tokens.
#
# Other files merged into this one before it is checked, each path relative to this directory: a
# directory (its *.toml files, by name), a glob (possibly matching nothing) or a file (it must
# exist).  Tables merge and [[hosts]] entries add up; a key given twice is refused, naming both
# files; an imported file cannot import.  Same owner and mode as this file.  E.g. the [[hosts]]
# entries in web.d/ (the hosts.toml of scripts/make-web-hosts.sh, or one file per room) and the
# secrets in a file of their own, secret and [admin] token then removed from here:
# import = ["web.d", "secrets.toml"]
#   # secrets.toml
#   secret = "change-me-to-a-long-random-string"
#   [admin]
#   token = "change-me-to-another-long-random-string"
#   [auth.ldap]
#   bind_password = "..."
#   [access_log.database]
#   password = "..."
#
# Behind a reverse proxy doing TLS (nginx, caddy): listen on the loopback and give public_url.
listen = "127.0.0.1:8450"
public_url = "https://sre.example.org"
# The site under a sub-path of a host name instead of its root (https://www.example.org/sre/):
# every URL of the portal lives under it.  The reverse proxy passes the requests as they come,
# without removing the prefix (nginx: location /sre/ { proxy_pass http://127.0.0.1:8450; }), and
# public_url names the site with the sub-path or without.
# base_path = "/sre"
# Signs the session cookies (32+ random characters; changing it logs everybody out).
secret = "change-me-to-a-long-random-string"
# Proxy mode (see [auth]): the addresses or networks of the reverse proxy, the only peers whose
# identity headers are trusted.  The portal reads no X-Forwarded-* header.
trusted_proxies = ["127.0.0.1", "::1"]
# Languages offered on the login page, the first one is the default.
languages = ["fr", "en", "de"]
# Own TLS instead of a proxy (optional).
# tls_cert = "/etc/sreweb/web.crt"
# tls_key = "/etc/sreweb/web.key"

[auth]
# "anonymous": every browser gets a pseudonym guest-xxxxxxxx (and may give a display name);
# "ldap": the users log in with their directory account;
# "proxy": the reverse proxy authenticates the users itself (Apache mod_authnz_ldap, see
#          sre-web-apache.conf) and passes their identity in request headers ([auth.proxy]).
mode = "anonymous"
# The administrators: the instructors who may read the connection log on the History page (its
# database, [access_log.database] below); a login that is not an instructor gets nothing.  By
# login here, by group with administrator_groups / administrator_group_filter of [auth.ldap] and
# administrator_groups of [auth.proxy].
administrators = []

[auth.ldap]
uri = "ldaps://ldap.example.org"
# Either bind as the user with a DN template...
bind_dn_template = "uid={login},ou=people,dc=example,dc=org"
# ... or search the user first (a service account, or an anonymous search), then bind as the user.
# search_base = "ou=people,dc=example,dc=org"
# search_filter = "(uid={login})"
# bind_dn = "cn=sre-web,ou=services,dc=example,dc=org"
# bind_password = "..."
attr_fullname = "cn"
attr_mail = "mail"
# The student group of the users (the first value of a multi-valued attribute): shown on the
# Watch page of the instructors, who can filter it, and kept in the answers files; "" = none.
# attr_group = "departmentNumber"
# The listing of the directory for the Groups page of the instructors (every mode): the login
# attribute of the people of search_base ("" = the attribute of a search_filter of the form
# "(attribute={login})"), the groups listed under group_search_base ("" = none), the attributes
# holding a group's name and its members (a value may be the login, the uid or the DN of a person).
# attr_login = ""
# groups_filter = "(objectClass=posixGroup)"
# attr_group_name = "cn"
# attr_group_members = "memberUid"
# Who is an instructor: the OR of the tests below (an empty key skips its test).
# 1. The members of these groups (DNs; the memberOf attribute of the user, or a group search
#    with group_filter = "(member={dn})" under group_search_base).
instructor_groups = []
# group_filter = "(member={dn})"
# 2. A filter the user's own entry must match (the primary group here; with the memberof
#    overlay: "(memberOf=cn=teachers,ou=groups,dc=example,dc=org)"); "" disables it.
instructor_filter = "(gidNumber=2000)"
# 3. A group naming the user, found under group_search_base (setting it enables this test):
#    {login} and {dn} are replaced (and escaped).  The default is a posixGroup of gid 2000; a
#    groupOfNames site writes "(&(cn=teachers)(member={dn}))".
# group_search_base = "ou=groups,dc=example,dc=org"
# instructor_group_filter = "(&(objectClass=posixGroup)(gidNumber=2000)(memberUid={login}))"
# 4. The administrators (the History page) among the instructors: the members of these groups
#    (DNs, tested like instructor_groups), or a group found under group_search_base naming the
#    user (like instructor_group_filter; no default: the test is off).
# administrator_groups = []
# administrator_group_filter = "(&(objectClass=posixGroup)(cn=sre-admins)(memberUid={login}))"
# The connection: an ldaps:// uri, or ldap:// with start_tls = true.  The server certificate is
# always verified (the chain against the system CA store, or against tls_ca: a CA bundle or the
# self-signed certificate of the server itself; the host of the uri against the names of the
# certificate, so name the server as its certificate does).  A plain ldap:// without start_tls
# sends the passwords and takes the roles and groups from an unauthenticated connection: the
# portal refuses to start unless allow_cleartext = true.
start_tls = false
# tls_ca = "/etc/sreweb/ldap-ca.pem"
# allow_cleartext = false
timeout = 10

[auth.proxy]
# The headers the reverse proxy sets on every request (sre-web-apache.conf sets these four from
# REMOTE_USER and the LDAP attributes).  The groups header holds the values of an attribute
# (memberOf...) joined by groups_separator; the members of instructor_groups are instructors.
header_login = "X-Remote-User"
header_fullname = "X-Remote-Name"
header_email = "X-Remote-Email"
header_groups = "X-Remote-Groups"
groups_separator = ";"
# The student group (sre-web-apache.conf sets X-Remote-Group from departmentNumber; the first
# value, split like the groups header); "" = none, unless ldap_roles / ldap_groups read attr_group
# below.
# header_group = "X-Remote-Group"
instructor_groups = []
# A second header test: the values of this header (an attribute mod_authnz_ldap exports, e.g.
# X-Remote-Gid set from AUTHENTICATE_GIDNUMBER) in instructor_values give the instructor role.
# instructor_header = "X-Remote-Gid"
# instructor_values = ["2000"]
# The values of the groups header making an instructor an administrator (the History page); with
# ldap_roles / ldap_groups below, the administrator_* tests of [auth.ldap] are run too.
# administrator_groups = []
# Or the portal runs the tests of [auth.ldap] itself for the login the proxy gives (needed for a
# group membership without the memberof overlay): fill uri, search_base / search_filter (or
# bind_dn_template), bind_dn / bind_password (or an anonymous search) and the instructor_* keys of
# [auth.ldap]; the role, and the group of attr_group, are cached per login for ldap_roles_ttl.
# ldap_roles = true
ldap_roles_ttl = "10m"
# Or only the group: the portal reads attr_group of [auth.ldap] (uri and search_base needed) for a
# user whose group header is empty and for the owners of the Watch page the agents know no group
# for (the projects of the Qt GUI); the roles stay those of the headers.  ldap_roles implies it.
# ldap_groups = true
# Where Logout sends the browser: the /apache-logout location of sre-web-apache.conf (HTTP Basic
# authentication: the browser forgets its credentials, its password dialog shows once more and is
# to be cancelled) or the logout handler of a mod_auth_form login; empty: no Logout button.
logout_url = ""

[pool]
# A project nobody touched for this long is evaluated (if the lab asks) and closed.
idle_timeout_anonymous = "2h"
idle_timeout_authenticated = "24h"
# Seconds between two polls of the agents.
poll_interval = 2
# Mutual TLS with the agents (scripts/web-tls.sh): the CA of the agents' certificates and the
# client certificate of the portal, which the agents require with their tls_ca.
# ca = "/etc/sreweb/tls/ca.crt"
# client_cert = "/etc/sreweb/tls/portal.crt"
# client_key = "/etc/sreweb/tls/portal.key"
# The elastic pool (hosts with a mac or a wake_command below): a sleeping host is woken when the
# free project slots of the hosts up drop below spare_projects, and min_hosts_up hosts are kept
# awake during active_hours (local time of the portal; "" = always).  A woken host silent after
# wake_timeout seconds is retried later (1, 2, 4... up to 30 minutes), one wake per wake_interval.
spare_projects = 5
min_hosts_up = 1
active_hours = "07:00-20:00"
wake_timeout = 180
wake_interval = 30
# Where the Wake-on-LAN packets go (UDP port 9): the broadcast address of the hosts' network when
# the portal is not on it (the routers must forward directed broadcasts).
wol_broadcast = "255.255.255.255"
# A host with power = true, up with no project for this long, above min_hosts_up and the spare
# capacity, is powered off through its agent (allow_power_off in agent.toml); 0 = never (the
# nightly cron of the hosts does it).
idle_host_timeout = 0
# The user logged in at the keyboard of a pool host (a local session, reported by the agent when
# its occupied_check includes the sessions) gets their new projects on that host whatever its
# load, below its max_projects; false: nothing goes to an occupied host.
follow_local_sessions = true
# The lab list of the Open page is asked from one host (the one a new project would go to, the
# next when it fails: every host serves the same lab tree) and kept this long per role (the
# reserved hosts are the instructors' only); 0 = asked at every open.
labs_cache_ttl = 60
# The preloads of the Docker images of the labs (`sre preload-images`, run by the agent of a host
# that asks for it: at its start with [preload] at_start of agent.toml, or `sre-web-tool preload`
# / the Pool page): this many hosts download at the same time, the others wait for their turn,
# the one that waited longest first; 0 = the portal gives no turn (nothing is preloaded).
max_preloads = 2
# The memory one project may need, in MiB (0 = not checked): a host takes no more new projects
# than its available memory (MemAvailable, sent by its agent) holds of them, each start in flight
# counting as one, and the spare capacity of the elastic pool counts the same slots.  Measure a
# project of the heaviest lab you run and add a margin.
project_memory_mb = 0
# What tells how much a host holds.  "projects": its number of projects against its max_projects
# (and project_memory_mb), every project counting the same.  "resources": its free memory and its
# processors against what a project of each lab costs: a project of thirty routers weighs more
# than one of four idle machines.  The agents measure their running projects ([usage] of
# agent.toml) and the portal learns the cost of each lab from them (`sre-web-tool costs`, the
# Costs table… button of the Open page); until three projects of a lab have been measured, its
# cost comes from the weight the lab declares (`sre make-titles`).  A host takes a project while
# its free memory and its processors hold the cost of the lab; a host without project always
# takes one; max_projects stays a ceiling.  The costs are learned and shown in both modes: try
# "resources" once they look right.
capacity = "projects"
# The memory kept free on every host, in MiB, and the share of the processors of a host its
# projects may use on average (the rest absorbs the bursts: starts, evaluations).
memory_reserve_mb = 1024
cpu_target = 0.7
# What one unit of the weight a lab declares stands for, in MiB and in cores (1 = one plain
# container): the cost of a lab whose projects were not measured yet.  Real projects measured on
# a classroom workstation used 3.9 MiB and 0.0003 core per unit, their evaluations included and
# nobody typing: the defaults add a margin.  `sre-web-tool costs` prints what the measures of
# your pool say a unit is: set these two from it.
weight_memory_mb = 5
weight_cpu = 0.001

[admin]
# The token of `sre-web-tool ...` (32+ random characters; empty: the command is refused), accepted
# from the loopback only unless listen_any = true.
token = "change-me-to-another-long-random-string"
# What is changed by hand in the pool (the hosts added, removed, enabled, disabled, drained, their
# priorities), merged
# with [[hosts]] at startup so that a restart of the portal leaves the pool as it was; an edit of
# the `enabled` or of the `priority` of a host below wins over an older change made by hand
# (default: /var/lib/sre-web/pool.json when that directory exists, else pool.json next to this file;
# the sre-web user must be able to write there: in a container, mount /var/lib/sre-web).
# state_file = "/var/lib/sre-web/pool.json"

[access_log]
# The connection log: one `key=value` line per event, in a file and / or in the portal's own
# log (stderr: the journal, `docker logs`).  Sessions (session_open / session_close: the requests
# of one login from one address, closed by a logout, by session_timeout of inactivity or at the
# shutdown, with the duration, the number of requests and the projects used), logins, starts
# (lab, host, outcome, name of the project), project pages, terminals and virtual desktops
# (open / close, duration), evaluations, states, stops, exports, denied calls, admin calls.  The
# client address is the last X-Forwarded-For entry when the peer is one of trusted_proxies.
# The file, rotated daily (keep: days kept; 0 = no rotation, for logrotate); none by default.
# The unit creates /var/log/sre-web (LogsDirectory); in a container, mount it or use
# /var/lib/sre-web/access.log.
# file = "/var/log/sre-web/access.log"
# keep = 400
# The lines also go to the portal's log (the journal): true by default, false with a file.
journal = true
session_timeout = "30m"

[access_log.database]
# The same events in a MariaDB / MySQL table (PyMySQL: python3-pymysql), where the History page
# of the administrators reads them (administrators of [auth]).  Off unless host or unix_socket
# is set.  One row per line: the time (UTC), event, login, address, host, project, lab, status
# and duration in columns, the other fields as JSON.  The table is created when it is missing
# (CREATE needed once; else create it by hand and grant SELECT, INSERT, DELETE only).  A server
# that does not answer never delays a request: the rows wait in memory (queue of them at most),
# one warning in the portal's log.  The password goes in the secrets file (see import above).
# host = "db.example.org"
# port = 3306
# unix_socket = "/run/mysqld/mysqld.sock"
# user = "sre_web"
# password = "..."
# name = "sre"
# table = "access_log"
# keep = 400
# queue = 10000
# connect_timeout = 5

[archives]
# The archives of the evaluations (every `sre eval` of the pool hosts: the students'
# self-evaluations, the periodic ones of the agents, the final one of a closing project, those of
# the Qt GUI) in a second table of the database above, collected from the agents every
# poll_interval (GET /v1/archives), for the Archives page of the instructors: the results (the
# grade elements, the totals, the mark, the errors, the student, the group, the lab, the host, the
# time), never the answers.  On iff [access_log.database] is set.  The table is created like
# access_log (or create it by hand: see the documentation); keep: days of rows kept (purged
# daily), 0 = forever.
# table = "archives"
# keep = 0
# poll_interval = "30s"
# directory: a directory of this host holding the archive files themselves (*.zst: a mount of the
# directory the pool hosts write them to, or a copy).  With it an instructor opens the whole
# content of an archive from the Archives page, as `sre cat` shows it (the commands run and their
# outputs, the answers, the data of the lab, the saved files), and downloads the file.  A file is
# looked up by its name at any depth, at each request: the files may be moved (a nightly
# rotation into dated directories).  Readable by sre-web (the archives are written 0600 for sre:
# see the documentation); needs python3-zstandard and python3-msgpack.  Not set: no file view.
# directory = "/srv/sre-archives"

[groups]
# The user groups of the Groups page of the instructors: the departments (attr_group of
# [auth.ldap]) and the groups of the directory (group_search_base + groups_filter), and the custom
# groups the instructors create there, in two tables of the database above (table and
# <table>_members, created when missing; or create them by hand with GRANT SELECT, INSERT, UPDATE,
# DELETE: see the documentation; on iff [access_log.database] is set).  directory_ttl: how long
# the people and groups read from the directory are kept (the page's Refresh reads them again);
# refresh_interval: the least time between two reads forced by Refresh (the clicks arriving
# during a read share it; 0 = none).
# table = "user_groups"
# directory_ttl = "10m"
# refresh_interval = "10s"

[exams]
# The exams of the Exams page of the instructors (an audience of logins and/or groups, the labs
# to do, a duration and/or a window, the networks the students' browsers must come from), in
# two tables of the database above (table and <table>_members, created when missing; or create
# them by hand with GRANT SELECT, INSERT, UPDATE, DELETE: see the documentation; on iff
# [access_log.database] is set).  The defaults of a new exam, each adjustable per exam: lead,
# how long before the start the other projects of the students are hidden and the countdown
# shown; pre_start, how long before the start their exam projects are started in the
# background; eval_interval, the period of the evaluations the agents run during the exam.
# close_after: how long after the end of a student's exam their exam projects are closed (0 =
# never: an instructor closes them from the page).  keep: days the past exams are kept (0 =
# forever).
# An exam may also list machines of the pool, where it is taken with the Qt GUI: their agents
# write exam.json (what `sre set-exam` does by hand).  host_lead: how long before the start
# the file is written, the machine locked and out of the pool; host_release: how long after
# the end-before time it is removed and the exam projects of the machine closed (0 = at the
# end; until then the students keep the end screen and extra minutes may still be granted).
# Both are defaults, adjustable per exam.
# lead = "10m"
# pre_start = "5m"
# eval_interval = "60s"
# close_after = "1h"
# host_lead = "10m"
# host_release = "10m"
# table = "exams"
# keep = 0

[site]
# The institution, shown next to the SRE logo in the header of every page (the login page too):
# the absolute path of an image file (JPG, PNG, SVG...; readable by sre-web, served at
# /site/logo), a name (a string, or one per language) and the page the two link to.  Nothing
# here: the SRE logo alone.
# logo = "/etc/sysreseval/logo.jpg"
# name = "Example Institute"
# name = { fr = "Institut Exemple", en = "Example Institute" }
# url = "https://www.example.org/"

[bbb]
# The BigBlueButton server behind the Webconf button of the instructors: an instructor opens a
# room for chosen students or groups, and the client is shown in a window over their pages (see
# the documentation, "Web conference").  Nothing here: no button.  The portal calls the API of
# the server (url + secret: `bbb-conf --secret` on the server), the browsers load its client, so
# the server must be reachable from both, over HTTPS, and its nginx must let the portal frame
# the client; public_url (above) is required: the client comes back to it after Leave meeting.
# url = "https://bbb.example.org/"
# secret = "the shared secret of the API"
# checksum = "sha1"          # sha1 (default), sha256 or sha512 (supportedChecksumAlgorithms of the server)
# welcome = { fr = "Bienvenue", en = "Welcome" }   # the welcome message of the client; the server's by default
# record = false             # record the meetings
# mute_on_start = false      # everybody muted when joining
# duration = 0               # "2h": the server ends a meeting after that; 0 = unlimited
# max_participants = 0       # 0 = unlimited
# poll_interval = "10s"      # how often the participants and the ended meetings are read from the server
# private_rooms = true       # the Talk privately button of an instructor on a student's project: a private
#                            # conversation of the two (a second meeting both browsers show instead of the
#                            # class conference, the student invited first); false removes the button
# [bbb.userdata]             # the bbb_* client settings sent with every join (userdata-bbb_* of the API reference)
# bbb_skip_check_audio = true
# [bbb.private_userdata]     # those of the joins of a private conversation, over [bbb.userdata] and the portal's
#                            # own (bbb_auto_join_audio, bbb_listen_only_mode = false, bbb_skip_check_audio,
#                            # bbb_hide_presentation_on_join: straight to the microphone)
# bbb_listen_only_mode = true

[limits]
eval_interval = 10        # seconds between two self-evaluations of one user
start_interval = 30       # seconds between two starts of one user
login_per_minute = 5      # login attempts per client address
max_answer_bytes = 1048576

# One entry per pool host: the URL of its agent, the token of its agent.toml, and how many
# projects it takes (a classroom workstation holds about thirty).  A host with a mac (Wake-on-LAN)
# or a wake_command ({name} and {mac} substituted: a relay, IPMI, a VM start) is woken on demand;
# power = true lets the portal power it off (see idle_host_timeout and `sre-web-tool poweroff`).
# instructors_only = true reserves a host for the instructors' projects: never a student's, they
# choose it on their Open page; it is outside the elastic pool (no spare capacity, no floor, never
# woken by the portal; powered off when idle like the others).
# priority = "group:order" (two integers from -9999 to 9999, "0:0" by default) says which hosts are
# used first.  The group is strict: a new project goes to the lowest group that has an available
# host (up, not full, not occupied), whatever the load of its hosts; inside the group it goes to
# the least loaded host, the lowest order first among the hosts without project.  The hosts are
# woken in that order and powered off, when idle, in the reverse one.  One host per group ("1:0",
# "2:0", "3:0"...) fills the hosts one after the other and lets idle_host_timeout power the
# others off: virtual machines sharing the processors of one server.  The instructors change it
# on the Pool page.  (One integer N, the priority of before the groups, is read as "0:N".)
# total_usable_capacity = N (a percentage, an integer from 1 to 100; 100, the whole host, by
# default) is the share of the memory and of the processors of the host its projects may fill:
# with [pool] capacity = "resources" the host counts as a machine that share of its size (its
# memory less memory_reserve_mb and its processors by cpu_target, both multiplied by it), and
# what is in use there counts against it, whoever uses it.  Nothing with capacity = "projects":
# max_projects is what a host holds there.
# `sre-web-tool add / remove / enable / disable / priority / usable-capacity` change the pool
# without a restart.
[[hosts]]
name = "a01"
url = "https://10.0.0.11:8451"       # http:// without TLS on the agent
token = "change-me-to-a-long-random-string"
max_projects = 25
# mac = "aa:bb:cc:dd:ee:ff"
# power = true

# [[hosts]]
# name = "a02"
# url = "http://10.0.0.12:8451"
# token = "..."
# max_projects = 25
# wake_command = "ssh relay wakeonlan {mac}"
# enabled = false                    # kept in the pool, no project placed there
# instructors_only = true            # never a student's project; the instructors choose it on the Open page
# priority = "1:0"                   # group 1: used when no host of group 0 can take the project
# total_usable_capacity = 50         # its projects fill half of its memory and processors at most
