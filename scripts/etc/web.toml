# /etc/sreweb/web.toml (checkout) or /etc/sysreseval/web.toml (Debian package): the SRE web site
# (sre-web).  Owned by root, group sre-web, mode 0640: it holds the secret and the tokens.
#
# Other files merged into this one before it is checked, each path relative to this directory: a
# directory (its *.toml files, by name), a glob (possibly matching nothing) or a file (it must
# exist).  Tables merge and [[hosts]] entries add up; a key given twice is refused, naming both
# files; an imported file cannot import.  Same owner and mode as this file.  E.g. the [[hosts]]
# entries in web.d/ (the hosts.toml of scripts/make-web-hosts.sh, or one file per room) and the
# secrets in a file of their own, secret and [admin] token then removed from here:
# import = ["web.d", "secrets.toml"]
#   # secrets.toml
#   secret = "change-me-to-a-long-random-string"
#   [admin]
#   token = "change-me-to-another-long-random-string"
#   [auth.ldap]
#   bind_password = "..."
#   [access_log.database]
#   password = "..."
#
# Behind a reverse proxy doing TLS (nginx, caddy): listen on the loopback and give public_url.
listen = "127.0.0.1:8450"
public_url = "https://sre.example.org"
# Signs the session cookies (32+ random characters; changing it logs everybody out).
secret = "change-me-to-a-long-random-string"
# Proxy mode (see [auth]): the addresses or networks of the reverse proxy, the only peers whose
# identity headers are trusted.  The portal reads no X-Forwarded-* header.
trusted_proxies = ["127.0.0.1", "::1"]
# Languages offered on the login page, the first one is the default.
languages = ["fr", "en"]
# Own TLS instead of a proxy (optional).
# tls_cert = "/etc/sreweb/web.crt"
# tls_key = "/etc/sreweb/web.key"

[auth]
# "anonymous": every browser gets a pseudonym guest-xxxxxxxx (and may give a display name);
# "ldap": the users log in with their directory account;
# "proxy": the reverse proxy authenticates the users itself (Apache mod_authnz_ldap, see
#          sre-web-apache.conf) and passes their identity in request headers ([auth.proxy]).
mode = "anonymous"
# The administrators: the instructors who may read the connection log on the History page (its
# database, [access_log.database] below); a login that is not an instructor gets nothing.  By
# login here, by group with administrator_groups / administrator_group_filter of [auth.ldap] and
# administrator_groups of [auth.proxy].
administrators = []

[auth.ldap]
uri = "ldaps://ldap.example.org"
# Either bind as the user with a DN template...
bind_dn_template = "uid={login},ou=people,dc=example,dc=org"
# ... or search the user first (a service account, or an anonymous search), then bind as the user.
# search_base = "ou=people,dc=example,dc=org"
# search_filter = "(uid={login})"
# bind_dn = "cn=sre-web,ou=services,dc=example,dc=org"
# bind_password = "..."
attr_fullname = "cn"
attr_mail = "mail"
# The student group of the users (the first value of a multi-valued attribute): shown on the
# Watch page of the instructors, who can filter it, and kept in the answers files; "" = none.
# attr_group = "departmentNumber"
# Who is an instructor: the OR of the tests below (an empty key skips its test).
# 1. The members of these groups (DNs; the memberOf attribute of the user, or a group search
#    with group_filter = "(member={dn})" under group_search_base).
instructor_groups = []
# group_filter = "(member={dn})"
# 2. A filter the user's own entry must match (the primary group here; with the memberof
#    overlay: "(memberOf=cn=teachers,ou=groups,dc=example,dc=org)"); "" disables it.
instructor_filter = "(gidNumber=2000)"
# 3. A group naming the user, found under group_search_base (setting it enables this test):
#    {login} and {dn} are replaced (and escaped).  The default is a posixGroup of gid 2000; a
#    groupOfNames site writes "(&(cn=teachers)(member={dn}))".
# group_search_base = "ou=groups,dc=example,dc=org"
# instructor_group_filter = "(&(objectClass=posixGroup)(gidNumber=2000)(memberUid={login}))"
# 4. The administrators (the History page) among the instructors: the members of these groups
#    (DNs, tested like instructor_groups), or a group found under group_search_base naming the
#    user (like instructor_group_filter; no default: the test is off).
# administrator_groups = []
# administrator_group_filter = "(&(objectClass=posixGroup)(cn=sre-admins)(memberUid={login}))"
start_tls = false
timeout = 10

[auth.proxy]
# The headers the reverse proxy sets on every request (sre-web-apache.conf sets these four from
# REMOTE_USER and the LDAP attributes).  The groups header holds the values of an attribute
# (memberOf...) joined by groups_separator; the members of instructor_groups are instructors.
header_login = "X-Remote-User"
header_fullname = "X-Remote-Name"
header_email = "X-Remote-Email"
header_groups = "X-Remote-Groups"
groups_separator = ";"
# The student group (sre-web-apache.conf sets X-Remote-Group from departmentNumber; the first
# value, split like the groups header); "" = none, unless ldap_roles / ldap_groups read attr_group
# below.
# header_group = "X-Remote-Group"
instructor_groups = []
# A second header test: the values of this header (an attribute mod_authnz_ldap exports, e.g.
# X-Remote-Gid set from AUTHENTICATE_GIDNUMBER) in instructor_values give the instructor role.
# instructor_header = "X-Remote-Gid"
# instructor_values = ["2000"]
# The values of the groups header making an instructor an administrator (the History page); with
# ldap_roles / ldap_groups below, the administrator_* tests of [auth.ldap] are run too.
# administrator_groups = []
# Or the portal runs the tests of [auth.ldap] itself for the login the proxy gives (needed for a
# group membership without the memberof overlay): fill uri, search_base / search_filter (or
# bind_dn_template), bind_dn / bind_password (or an anonymous search) and the instructor_* keys of
# [auth.ldap]; the role, and the group of attr_group, are cached per login for ldap_roles_ttl.
# ldap_roles = true
ldap_roles_ttl = "10m"
# Or only the group: the portal reads attr_group of [auth.ldap] (uri and search_base needed) for a
# user whose group header is empty and for the owners of the Watch page the agents know no group
# for (the projects of the Qt GUI); the roles stay those of the headers.  ldap_roles implies it.
# ldap_groups = true
# Where Logout sends the browser: the /apache-logout location of sre-web-apache.conf (HTTP Basic
# authentication: the browser forgets its credentials, its password dialog shows once more and is
# to be cancelled) or the logout handler of a mod_auth_form login; empty: no Logout button.
logout_url = ""

[pool]
# A project nobody touched for this long is evaluated (if the lab asks) and closed.
idle_timeout_anonymous = "2h"
idle_timeout_authenticated = "24h"
# Seconds between two polls of the agents.
poll_interval = 2
# Mutual TLS with the agents (scripts/web-tls.sh): the CA of the agents' certificates and the
# client certificate of the portal, which the agents require with their tls_ca.
# ca = "/etc/sreweb/tls/ca.crt"
# client_cert = "/etc/sreweb/tls/portal.crt"
# client_key = "/etc/sreweb/tls/portal.key"
# The elastic pool (hosts with a mac or a wake_command below): a sleeping host is woken when the
# free project slots of the hosts up drop below spare_projects, and min_hosts_up hosts are kept
# awake during active_hours (local time of the portal; "" = always).  A woken host silent after
# wake_timeout seconds is retried later (1, 2, 4... up to 30 minutes), one wake per wake_interval.
spare_projects = 5
min_hosts_up = 1
active_hours = "07:00-20:00"
wake_timeout = 180
wake_interval = 30
# Where the Wake-on-LAN packets go (UDP port 9): the broadcast address of the hosts' network when
# the portal is not on it (the routers must forward directed broadcasts).
wol_broadcast = "255.255.255.255"
# A host with power = true, up with no project for this long, above min_hosts_up and the spare
# capacity, is powered off through its agent (allow_power_off in agent.toml); 0 = never (the
# nightly cron of the hosts does it).
idle_host_timeout = 0
# The user logged in at the keyboard of a pool host (a local session, reported by the agent when
# its occupied_check includes the sessions) gets their new projects on that host whatever its
# load, below its max_projects; false: nothing goes to an occupied host.
follow_local_sessions = true
# The lab list of the Open page is asked from one host (the one a new project would go to, the
# next when it fails: every host serves the same lab tree) and kept this long per role (the
# reserved hosts are the instructors' only); 0 = asked at every open.
labs_cache_ttl = 60

[admin]
# The token of `sre-web-tool ...` (32+ random characters; empty: the command is refused), accepted
# from the loopback only unless listen_any = true.
token = "change-me-to-another-long-random-string"
# The hosts added, removed, enabled and disabled by hand, merged with [[hosts]] at startup
# (default: /var/lib/sre-web/pool.json when that directory exists, else pool.json next to this file).
# state_file = "/var/lib/sre-web/pool.json"

[access_log]
# The connection log: one `key=value` line per event, in a file and / or in the portal's own
# log (stderr: the journal, `docker logs`).  Sessions (session_open / session_close: the requests
# of one login from one address, closed by a logout, by session_timeout of inactivity or at the
# shutdown, with the duration, the number of requests and the projects used), logins, starts
# (lab, host, outcome, name of the project), project pages, terminals and virtual desktops
# (open / close, duration), evaluations, states, stops, exports, denied calls, admin calls.  The
# client address is the last X-Forwarded-For entry when the peer is one of trusted_proxies.
# The file, rotated daily (keep: days kept; 0 = no rotation, for logrotate); none by default.
# The unit creates /var/log/sre-web (LogsDirectory); in a container, mount it or use
# /var/lib/sre-web/access.log.
# file = "/var/log/sre-web/access.log"
# keep = 400
# The lines also go to the portal's log (the journal): true by default, false with a file.
journal = true
session_timeout = "30m"

[access_log.database]
# The same events in a MariaDB / MySQL table (PyMySQL: python3-pymysql), where the History page
# of the administrators reads them (administrators of [auth]).  Off unless host or unix_socket
# is set.  One row per line: the time (UTC), event, login, address, host, project, lab, status
# and duration in columns, the other fields as JSON.  The table is created when it is missing
# (CREATE needed once; else create it by hand and grant SELECT, INSERT, DELETE only).  A server
# that does not answer never delays a request: the rows wait in memory (queue of them at most),
# one warning in the portal's log.  The password goes in the secrets file (see import above).
# host = "db.example.org"
# port = 3306
# unix_socket = "/run/mysqld/mysqld.sock"
# user = "sre_web"
# password = "..."
# name = "sre"
# table = "access_log"
# keep = 400
# queue = 10000
# connect_timeout = 5

[site]
# The institution, shown next to the SRE logo in the header of every page (the login page too):
# the absolute path of an image file (JPG, PNG, SVG...; readable by sre-web, served at
# /site/logo), a name (a string, or one per language) and the page the two link to.  Nothing
# here: the SRE logo alone.
# logo = "/etc/sysreseval/logo.jpg"
# name = "Example Institute"
# name = { fr = "Institut Exemple", en = "Example Institute" }
# url = "https://www.example.org/"

[limits]
eval_interval = 10        # seconds between two self-evaluations of one user
start_interval = 30       # seconds between two starts of one user
login_per_minute = 5      # login attempts per client address
max_answer_bytes = 1048576

# One entry per pool host: the URL of its agent, the token of its agent.toml, and how many
# projects it takes (a classroom workstation holds about thirty).  A host with a mac (Wake-on-LAN)
# or a wake_command ({name} and {mac} substituted: a relay, IPMI, a VM start) is woken on demand;
# power = true lets the portal power it off (see idle_host_timeout and `sre-web-tool poweroff`).
# instructors_only = true reserves a host for the instructors' projects: never a student's, they
# choose it on their Open page; it is outside the elastic pool (no spare capacity, no floor, never
# woken by the portal; powered off when idle like the others).
# `sre-web-tool add / remove / enable / disable` change the pool without a restart.
[[hosts]]
name = "a01"
url = "https://10.0.0.11:8451"       # http:// without TLS on the agent
token = "change-me-to-a-long-random-string"
max_projects = 25
# mac = "aa:bb:cc:dd:ee:ff"
# power = true

# [[hosts]]
# name = "a02"
# url = "http://10.0.0.12:8451"
# token = "..."
# max_projects = 25
# wake_command = "ssh relay wakeonlan {mac}"
# enabled = false                    # kept in the pool, no project placed there
# instructors_only = true            # never a student's project; the instructors choose it on the Open page
