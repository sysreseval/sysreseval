# Apache 2.4 in front of sre-web, authenticating the users itself: the proxy mode of web.toml
#   listen = "127.0.0.1:8450"
#   public_url = "https://sre.example.org"
#   trusted_proxies = ["127.0.0.1", "::1"]
#   [auth] mode = "proxy"
# The users are authenticated here against the LDAP directory (mod_authnz_ldap) and their identity
# is passed to sre-web in the X-Remote-* headers, set again on every request: "RequestHeader set"
# replaces whatever the browser sent, so they cannot be forged.  sre-web trusts those headers from
# the addresses of trusted_proxies only, so it must listen on the loopback (or on an address that
# only this proxy reaches).
# Modules: a2enmod ssl proxy proxy_http proxy_wstunnel headers authnz_ldap ldap
# (upgrade=websocket needs Apache >= 2.4.47: Debian 12 and later).
# The administration command (sre-web pool ...) talks to the loopback port directly, never through
# this virtual host: the Basic authentication would refuse its bearer token.
<VirtualHost *:443>
    ServerName sre.example.org
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/sre.example.org.pem
    SSLCertificateKeyFile /etc/ssl/private/sre.example.org.key

    <Location "/">
        AuthType Basic
        AuthName "SRE"
        AuthBasicProvider ldap
        # The attributes listed in the URL (uid, cn, mail, memberOf) are exported as AUTHENTICATE_*
        # for the headers below.  memberOf needs the memberof overlay of OpenLDAP; any other
        # attribute does (eduPersonAffiliation...): list it here and its values in instructor_groups.
        AuthLDAPURL "ldaps://ldap.example.org/ou=people,dc=example,dc=org?uid,cn,mail,memberOf?sub?(objectClass=inetOrgPerson)"
        # A service account when the directory refuses anonymous searches:
        # AuthLDAPBindDN "cn=sre-web,ou=services,dc=example,dc=org"
        # AuthLDAPBindPassword "..."
        AuthLDAPRemoteUserAttribute uid
        Require valid-user
        # or the members of a group only:
        # Require ldap-group cn=students,ou=groups,dc=example,dc=org

        # The identity headers (the names of [auth.proxy] in web.toml), set after the authentication
        # (never "early"); the optional ones are removed, then set only when the attribute exists
        # (mod_headers would write the literal "(null)" otherwise).  A multi-valued attribute is
        # joined with "; " (groups_separator).
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
        RequestHeader unset X-Remote-Name
        RequestHeader set X-Remote-Name "%{AUTHENTICATE_CN}e" env=AUTHENTICATE_CN
        RequestHeader unset X-Remote-Email
        RequestHeader set X-Remote-Email "%{AUTHENTICATE_MAIL}e" env=AUTHENTICATE_MAIL
        RequestHeader unset X-Remote-Groups
        RequestHeader set X-Remote-Groups "%{AUTHENTICATE_MEMBEROF}e" env=AUTHENTICATE_MEMBEROF
        # The password stays here.
        RequestHeader unset Authorization
        RequestHeader set X-Forwarded-Proto "https"
    </Location>

    # The pages, the NDJSON streams of the starts and the WebSockets of the terminals; the Host
    # header is kept (the portal checks the Origin of its WebSockets against it); idle terminals
    # stay open.
    ProxyPreserveHost On
    ProxyPass        "/" "http://127.0.0.1:8450/" upgrade=websocket timeout=3600
    ProxyPassReverse "/" "http://127.0.0.1:8450/"
</VirtualHost>

