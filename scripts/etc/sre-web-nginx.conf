# nginx in front of sre-web: TLS, HTTP/2 for the pages, the WebSockets of the terminals and the
# NDJSON streams of the starts relayed without buffering.
server {
    listen 443 ssl;
    http2 on;
    server_name sre.example.org;
    ssl_certificate     /etc/ssl/certs/sre.example.org.pem;
    ssl_certificate_key /etc/ssl/private/sre.example.org.key;

    location / {
        proxy_pass http://127.0.0.1:8450;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;          # idle terminals
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
